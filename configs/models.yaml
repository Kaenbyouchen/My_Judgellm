anthropic:
  defaults:
    api_key_env: "ANTHROPIC_API_KEY"
    temperature: 0.0
    max_tokens: 1000
  claude35_sonnet:
    model_name: "claude-3-5-sonnet-20240620"
  claude_opus_45:
    model_name: "claude-opus-4.5"
  claude_sonnet_45:
    model_name: "claude-sonnet-4.5"

gemini:
  defaults:
    api_key_env: "GEMINI_API_KEY"
    temperature: 0.0
    max_tokens: 1000
  gemini3_pro:
    model_name: "gemini-3-pro-preview"
  gemini3_flash:
    model_name: "gemini-3-flash-preview"
  gemini25_pro:
    model_name: "gemini-2.5-pro"
  gemini25_flash:
    model_name: "gemini-2.5-flash"

vllm:
  defaults:
    tensor_parallel_size: 1
    max_model_len: 2048
    dtype: "auto"
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    gpu_memory_utilization: 0.9
    download_dir: "src/models"  # Local cache directory for downloaded models
  
  # ============================================================================
  # General SOTA Models (通用 SOTA 模型)
  # ============================================================================
  qwen3_next_80b_a3b_instruct:
    model_name: "Qwen/Qwen3-Next-80B-A3B-Instruct"  # Qwen3 Next 80B A3B Instruct model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  
  # ============================================================================
  # Medical SOTA Models (医疗领域 SOTA 模型)
  # ============================================================================
  medgemma_4b:
    model_name: "google/medgemma-4b-it"  # MedGemma 4B Instruction-Tuned model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  medgemma_27b:
    model_name: "google/medgemma-27b-it"  # MedGemma 27B Instruction-Tuned model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  biomistral_7b:
    model_name: "BioMistral/BioMistral-7B"  # BioMistral 7B model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  medical_qwen3_14b_1218:
    model_name: "zjydiary/Medical-Qwen3-14B-1218"  # Medical Qwen3 14B model (1218 version) from ModelScope
    local_cache_dir: "src/models"  # Download to src/models/ folder
    use_modelscope: true  # Use ModelScope to download this model
  
  # ============================================================================
  # Judge Expert Models (判断专家模型)
  # ============================================================================
  prometheus2_7b:
    model_name: "prometheus-eval/prometheus-7b-v2.0"  # Prometheus 2 7B model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  prometheus2_8x7b:
    model_name: "prometheus-eval/prometheus-8x7b-v2.0"  # Prometheus 2 8x7B model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  
  # ============================================================================
  # Small Models (小型模型)
  # ============================================================================
  gemma3_4b:
    model_name: "google/gemma-3-4b-it"  # Gemma 3 4B Instruction-Tuned version
    local_cache_dir: "src/models"  # Download to src/models/ folder
  gemma3_12b:
    model_name: "google/gemma-3-12b-it"  # Gemma 3 12B Instruction-Tuned version
    local_cache_dir: "src/models"  # Download to src/models/ folder
  gemma3_27b:
    model_name: "google/gemma-3-27b-it"  # Gemma 3 27B Instruction-Tuned version
    local_cache_dir: "src/models"  # Download to src/models/ folder
  qwen3_4b_instruct:
    model_name: "Qwen/Qwen3-4B-Instruct-2507"  # Qwen3 4B Instruct model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  qwen3_14b_instruct:
    model_name: "OpenPipe/Qwen3-14B-Instruct"  # Qwen3 14B Instruct model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  llama32_3b_instruct:
    model_name: "meta-llama/Llama-3.2-3B-Instruct"  # Llama 3.2 3B Instruct model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  llama31_8b_instruct:
    model_name: "meta-llama/Llama-3.1-8B-Instruct"  # Llama 3.1 8B Instruct model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  llama4_scout_instruct:
    model_name: "meta-llama/Llama-4-Scout-17B-16E-Instruct"  # Llama 4 Scout 17B Instruct model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  llama33_70b_instruct:
    model_name: "meta-llama/Llama-3.3-70B-Instruct"  # Llama 3.3 70B Instruct model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  deepseek_r1_distill_llama_8b:
    model_name: "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"  # DeepSeek R1 Distill Llama 8B model
    local_cache_dir: "src/models"  # Download to src/models/ folder
  deepseek_r1_distill_qwen_7b:
