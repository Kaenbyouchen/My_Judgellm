    allow_empty_api_key: true
  vllmserve_qwen3_next_80b_a3b_instruct:
    model_name: "Qwen/Qwen3-Next-80B-A3B-Instruct"
    base_url_env: "VLLM_BASE_URL"
    allow_empty_api_key: true
  vllmserve_medgemma_27b:
    model_name: "google/medgemma-27b-it"
    base_url_env: "VLLM_BASE_URL"
    allow_empty_api_key: true
  vllmserve_medical_qwen3_14b_1218:
    model_name: "zjydiary/Medical-Qwen3-14B-1218"
