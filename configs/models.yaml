# Model Pool (模型池)
# - models.yaml 只声明“所有可用模型”，不决定本次实验用哪个模型
# - experiment.yaml 通过 provider + model_id 选择
#
# New (recommended) format:
#   <provider>:
#     defaults: {... optional provider-level defaults ...}
#     <model_id_1>: {... model-specific config ...}
#     <model_id_2>: {...}
#
# Backward compatible (old) format is still supported by code:
#   <provider>: { flat config ... }
#   and experiment.yaml's model_id/model_name will be treated as the actual model name.

openai:
  defaults:
    api_key_env: "OPENAI_API_KEY"
    temperature: 0.0
    max_tokens: 1000
  gpt4omini:
    model_name: "gpt-4o-mini"
  gpt41:
    model_name: "gpt-4.1"
  gpt52:
    model_name: "gpt-5.2"
  gpt54:
    model_name: "gpt-5.4"
  gpt5mini:
    model_name: "gpt-5-mini"
  # vLLM serve (OpenAI-compatible API) model IDs.
  # Usage:
  #   1) start server: vllm serve <HF_MODEL_NAME> --port 8000
  #   2) export VLLM_BASE_URL=http://127.0.0.1:8000/v1
  #   3) use model id below in experiment/batch config
  # Note: OpenAI SDK requires an API key field; for local vLLM serve we allow empty.
  vllmserve_medgemma_4b:
    model_name: "google/medgemma-4b-it"
    base_url_env: "VLLM_BASE_URL"
    allow_empty_api_key: true
  vllmserve_biomistral_7b:
    model_name: "BioMistral/BioMistral-7B"
    base_url_env: "VLLM_BASE_URL"
    allow_empty_api_key: true
  vllmserve_prometheus2_7b:
    model_name: "prometheus-eval/prometheus-7b-v2.0"
    base_url_env: "VLLM_BASE_URL"
    allow_empty_api_key: true
  vllmserve_gemma3_4b:
    model_name: "google/gemma-3-4b-it"
    base_url_env: "VLLM_BASE_URL"
    allow_empty_api_key: true
  vllmserve_qwen3_4b_instruct:
    model_name: "Qwen/Qwen3-4B-Instruct-2507"
    base_url_env: "VLLM_BASE_URL"
    allow_empty_api_key: true
  vllmserve_llama32_3b_instruct:
