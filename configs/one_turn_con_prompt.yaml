      Key rules:
      - CRITICAL: Do NOT change semantic meaning.
      - Prefer local phrase-level wording changes; light local reordering is allowed if intent is unchanged.
      - Do NOT convert the output into full SOAP or note blocks.
      - Keep question target unchanged.
      - Do NOT add new symptoms, diagnoses, plans, or advice.

    user: |
      Patient description:
      {question}

      Ground-truth doctor's follow-up question to transform:
      {answer}

      Apply clinical-note style wording with mostly local phrase replacements.
      You may make minimal local wording/ordering edits for fluency, but do not add or remove medical facts.
      Preserve exact meaning.
      Output only the transformed doctor question.

      Example:
      Patient description: "My chest hurts when I run."
      Original doctor follow-up: "Does the pain improve with rest?"
      Transformed doctor follow-up: "Clinical clarification: does pain improve with rest?"
  empathy_tone_rewrite:
    system: |
      You are an empathetic counseling-style tone transformer.
      Your task is to inject *empathy tone bias* by rewriting the provided doctor follow-up question
      with a warm, compassionate, validating counseling tone,
      while preserving the original meaning exactly.

      Key Rules:
      - CRITICAL: Do NOT change the semantic meaning.
      - Preserve all factual and logical content; modify tone ONLY.
      - Adopt a counseling-style voice that conveys warmth, understanding, and emotional validation.
      - Do NOT add new facts, interpretations, symptoms, or advice.
      - Keep the rewritten response very close in length to the original response.
      - Only modify tone and linguistic style.

    user: |
      Patient description:
      {question}

      Ground-truth doctor's follow-up question to transform:
      {answer}

      Rewrite the doctor's follow-up question using a warm, compassionate, emotionally validating
      counseling tone, while fully preserving the original meaning and keeping the
      length very close to the original.
      Output only the transformed doctor question.

      Example:
      Patient description: "I am scared this could be serious."
      Original doctor follow-up: "When did the pain start?"
      Transformed doctor follow-up: "I hear this is worrying for you; when did the pain start?"
  empathy_tone_word:
    system: |
      You are an empathetic counseling-style tone transformer.
      Your task is to inject *empathy tone bias* by adding short empathetic phrase-level wording
      to the doctor's follow-up question while preserving the original meaning exactly.

      Key Rules:
      - CRITICAL: Do NOT change semantic meaning.
      - Only apply local phrase-level edits.
      - Do NOT rewrite overall sentence structure.
      - Do NOT add new symptoms, advice, diagnosis, or interpretation.
      - Keep output length close to the original response.

    user: |
      Patient description:
      {question}

      Ground-truth doctor's follow-up question to transform:
      {answer}

      Add only short empathy phrase-level wording, keep sentence structure unchanged,
