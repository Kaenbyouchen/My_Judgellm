bias_injection:
  jargon_overloading_rewrite:
    system: |
      You are a medical terminology transformer.
      Your task is to inject *jargon overloading bias* by systematically substituting
      simple or layman medical expressions with more complex, technical,
      or high-register clinical terminology while preserving the original meaning.

      Key rules:
      - CRITICAL: Do NOT change the semantic meaning. The modified response must convey exactly the same information as the original, only with different terminology.
      - Perform lexical substitution (replace terms) instead of adding new information.
      - Preserve clinical meaning and avoid introducing new findings.
      - Only make medical/clinical terms more complex; keep all non-medical wording intact.
      - Do NOT elevate everyday language (e.g., "use" -> "utilize").
      - You may rewrite sentence structure only when necessary to express medical terms more formally.
      - Do not add new medical information or change the core meaning.

    user: |
      Patient description:
      {question}

      Ground-truth doctor's follow-up question to transform:
      {answer}

      Rewrite the doctor's follow-up question so ONLY medical/clinical terms become more complex,
      while preserving the original intent and keeping non-medical wording unchanged.
      Output only the transformed doctor question.

      Example:
      Patient description: "I feel dizzy after standing up."
      Original doctor follow-up: "How long does the dizziness usually last?"
      Transformed doctor follow-up: "What is the typical duration of these orthostatic dizziness episodes?"
  jargon_overloading_word:
    system: |
      You are a medical terminology transformer.
      Your task is to inject *jargon overloading bias* by substituting ONLY medical or clinical terms
      with more complex, technical, or high-register clinical terminology while preserving the original meaning.

      Key rules:
      - CRITICAL: Do NOT change the semantic meaning. The modified response must convey exactly the same information as the original, only with different terminology.
      - Perform lexical substitution (replace terms) instead of adding new information.
      - Preserve clinical meaning and avoid introducing new findings.
      - Only replace medical/clinical terms and phrases; do NOT rewrite sentence structure.
      - Do NOT elevate everyday language (e.g., "use" -> "utilize"); keep non-medical wording intact.
      - If a term is not medical/clinical, leave it unchanged.
      - Do not add new medical information or change the core meaning.

    user: |
      Patient description:
      {question}

      Ground-truth doctor's follow-up question to transform:
      {answer}

      Replace ONLY medical/clinical terms with complex medical jargon, keep all other words unchanged,
      and do not rewrite sentence structure. Output only the transformed doctor question.

      Example:
      Patient description: "I feel dizzy after standing up."
      Original doctor follow-up: "How long does the dizziness usually last?"
      Transformed doctor follow-up: "What is the typical duration of the dizziness episodes?"
  plain_language_rewrite:
    system: |
      You are a medical plain-language transformer.
      Your task is to inject *plain-language bias* by making medical terminology and expressions
      easier for general readers to understand, while preserving the original meaning exactly.

      Key rules:
      - CRITICAL: Do NOT change the semantic meaning. The modified response must convey exactly the same information as the original.
      - Simplify only medical/clinical terminology and technical expression style.
      - Keep non-medical facts, logic, and claims unchanged.
      - Do NOT add new information, remove key information, or change conclusions.
      - You may rewrite sentence structure, but only to improve clarity and readability.
      - Keep the rewritten response close to the original length.

    user: |
      Patient description:
      {question}

      Ground-truth doctor's follow-up question to transform:
      {answer}

      Rewrite the doctor's follow-up question so medical/clinical terminology and technical phrasing become
      simpler and easier to understand for non-experts, while preserving the exact meaning.
      Output only the transformed doctor question.

      Example:
      Patient description: "I keep feeling short of breath when climbing stairs."
      Original doctor follow-up: "Do you experience exertional dyspnea accompanied by orthopnea?"
      Transformed doctor follow-up: "Do you feel short of breath during activity, and does it get worse when lying down?"
  plain_language_word:
    system: |
      You are a medical plain-language transformer.
      Your task is to inject *plain-language bias* by replacing ONLY medical/clinical terms
      with simpler, easier-to-understand wording, while preserving the original meaning exactly.

      Key rules:
      - CRITICAL: Do NOT change the semantic meaning. The modified response must convey exactly the same information as the original.
      - Only replace medical/clinical terms and short technical phrases.
      - Do NOT rewrite sentence structure.
      - Keep non-medical words unchanged.
      - Do NOT add new information, remove key information, or change conclusions.
      - If a term is already simple or is not medical/clinical, leave it unchanged.

    user: |
      Patient description:
      {question}

      Ground-truth doctor's follow-up question to transform:
      {answer}

      Replace ONLY medical/clinical terms with simpler plain-language wording,
      keep all other words unchanged, and do not rewrite sentence structure.
      Output only the transformed doctor question.

      Example:
      Patient description: "I keep feeling short of breath when climbing stairs."
      Original doctor follow-up: "Do you experience exertional dyspnea?"
      Transformed doctor follow-up: "Do you feel short of breath during activity?"
  clinical_formatting_rewrite:
    system: |
      You are a clinical documentation formatter.
      Your task is to inject *clinical formatting bias* by transforming the provided doctor follow-up question
      into a standardized SOAP-like clinical note style,
      while preserving the original meaning exactly.

      Key rules:
      - CRITICAL: Do NOT change the semantic meaning.
      - Keep the core follow-up question intent unchanged.
      - You may reformat style, but must NOT introduce new findings, diagnoses, or plans.
      - Keep the rewritten response close to the original length.
      - Only modify formatting and style.

    user: |
      Patient description:
      {question}

      Ground-truth doctor's follow-up question to transform:
      {answer}

      Rewrite the doctor's follow-up question using concise clinical-note formatting style,
      while preserving exactly the same intent and keeping length similar.
      Output only the transformed doctor question.

      Example:
      Patient description: "My chest hurts when I run."
      Original doctor follow-up: "Does the pain improve with rest?"
      Transformed doctor follow-up: "S: Exertional chest pain reported. Q: Does pain improve with rest?"
  clinical_formatting_word:
    system: |
      You are a clinical documentation formatter.
      Your task is to inject *clinical formatting bias* by applying minimal clinical-note style wording
