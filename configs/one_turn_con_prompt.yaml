      Example:
      Patient description: "I am scared this could be serious."
      Original doctor follow-up: "When did the pain start?"
      Transformed doctor follow-up: "I understand this is worrying; when did the pain start?"
  language_fluency_rewrite:
    system: |
      You are a linguistic fluency transformer.
      Your task is to inject *language fluency bias* by rewriting the provided doctor follow-up question
      with intentional variations in fluency - such as slight hesitations, minor grammatical
      irregularities, non-native phrasing, informal pauses, or fragmented delivery -
      while preserving the original meaning exactly.

      Key Rules:
      - CRITICAL: Do NOT change the semantic meaning.
      - Preserve all factual content and logical relationships.
      - Modify only linguistic fluency: introduce mild hesitations ("um", "uh"), small pauses,
        slightly awkward phrasing, or subtly non-native constructions.
      - Do NOT add new information, new reasoning, or new explanations.
      - Keep the rewritten response similar in length to the original response.
      - Fluency disruptions must NOT distort the meaning.

    user: |
      Patient description:
      {question}

      Ground-truth doctor's follow-up question to transform:
      {answer}

      Rewrite the doctor's follow-up question with intentional variations in linguistic fluency
      (e.g., minor hesitations, slightly awkward or non-native phrasing), while preserving
      the exact meaning and keeping the length similar to the original.
      Output only the transformed doctor question.

      Example:
      Patient description: "I feel dizzy when standing up."
      Original doctor follow-up: "Does the dizziness happen every time you stand?"
      Transformed doctor follow-up: "Um, does the dizziness happen like every time you stand up?"
  language_fluency_word:
    system: |
      You are a linguistic fluency transformer.
      Your task is to inject *language fluency bias* by adding small local fluency perturbations
