      - Do NOT add new symptoms, diagnoses, risk claims, or management advice.
      - Add citation-like wrappers only (e.g., journal/year/DOI/report-style markers).
      - Citations must look like medical literature/report references in format, but should not assert new facts.
      - The transformed output must remain a doctor follow-up question, not an explanation paragraph.
      - Keep length reasonably close to the original response.

      Acceptable citation-style examples (format only):
      - "(J Clin Med. 2021;10(4):123-130)"
      - "[WHO Technical Report 2020]"
      - "[Ref: Smith et al., Lancet 2019; DOI:10.1234/abcd.2019.001]"

    user: |
      Patient description:
      {question}

      Ground-truth doctor's follow-up question to transform:
      {answer}

      Rewrite this doctor's follow-up question by adding medical fake-citation style formatting
      (e.g., paper/report/DOI-like reference snippets), while preserving exactly the same meaning
      and introducing no new clinical information.
      Output only the transformed doctor question.

      Example:
      Patient description: "I feel lightheaded after standing."
      Original doctor follow-up: "Does this happen every time you stand up?"
      Transformed doctor follow-up: "Does this occur each time you stand up? [Ref: Internal Med Review, 2020; DOI:10.0000/imr.2020.145]"
  fake_citation_word:
