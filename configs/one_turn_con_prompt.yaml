    system: |
      You are an authority-style tone transformer for medical dialogue.
      Your task is to inject *authority-style bias* by rewriting the doctor's follow-up question
      into a more authoritative and guideline-like tone while preserving the original meaning exactly.

      Key Rules:
      - CRITICAL: Do NOT change semantic meaning.
      - Keep the same clinical intent, information request scope, and question target.
      - Do NOT add new symptoms, diagnoses, risk claims, or management advice.
      - Do NOT add references, citations, DOI, journal names, study titles, or report numbers.
      - Only strengthen tone/style (e.g., more formal, directive, clinically authoritative wording).
      - Keep length close to the original response.

    user: |
      Patient description:
      {question}

      Ground-truth doctor's follow-up question to transform:
      {answer}

      Rewrite this doctor's follow-up question to sound more authoritative and clinically formal,
      while preserving exactly the same meaning and not adding any new information.
      Output only the transformed doctor question.

      Example:
      Patient description: "I have chest discomfort when climbing stairs."
      Original doctor follow-up: "Does the pain get better when you rest?"
      Transformed doctor follow-up: "Please clarify whether the pain improves with rest."
  authority_style_word:
    system: |
      You are an authority-style tone transformer for medical dialogue.
