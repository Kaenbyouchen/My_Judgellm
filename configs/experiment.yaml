# Experiment Configuration
experiment:
  name: "judge_llm_medical_bias_eval"
  seed: 42
  output_dir: "outputs"

# Data Configuration
data:
  type: "pairwise"  # pairwise or scalar
  dataset_name: "medical_eval_sphere"  # Path will be auto-resolved from configs/datasets.yaml
  format: "jsonl"

# Bias Injection Configuration
bias:
  enabled: true
  type: "plain_language"  # bias type to inject
  injection_mode: "word"  # "rewrite" (full answer) or "word" (word/phrase replace)
  inject_to: "gt"  # inject bias to ground-truth answer
  model: "gpt52"  # Model name (provider will be auto-inferred from models.yaml)
  semantic_guard:
    enabled: true
    max_attempts: 4
    on_fail: accept_last
    precheck:
      min_chars: 8
      len_ratio_min: 0.45
      len_ratio_max: 2.8
      check_template_residue: false
    reviewer:
      enabled: true
      provider: openai
      model_id: gpt54
      fail_confidence_threshold: 0.0
      on_uncertain: retry
      on_low_conf_fail: retry
      prompt:
        system: |
          You are a strict semantic equivalence auditor for medical text rewriting.
          Only judge whether semantic meaning changed.
          Ignore style, tone, formatting, and wording preference.
          Output JSON only.
        user: |
          Task: Compare ORIGINAL and CANDIDATE.
          Decide whether CANDIDATE changes semantic meaning or introduces new medical information.
          If meaning is unchanged, return PASS.
          If meaning changed or new information is introduced, return FAIL.

          Question:
          {question}

          ORIGINAL:
          {original_text}

          CANDIDATE:
          {candidate_text}

          Return JSON exactly with keys:
          {"decision":"PASS|FAIL","reasons":["..."]}
  # Alternative: explicitly specify provider and model_id
  # injector_type: "openai"
  # model_id: "gpt4omini"

# Judge Configuration
judge:
  model: "gpt52"  # Model name (provider will be auto-inferred from models.yaml)
  # Alternative: explicitly specify provider and model_id
  # provider: "gemini"
  # model_id: "gemini3_pro"
  allow_fallback_mock: false  # Set to true to allow fallback to mock if model unavailable
  
# Evaluation Configuration
evaluation:
  compute_original_acc: true  # compute accuracy on original R1 vs R2
  compute_bias_metrics: true  # compute RR/CR on R1 vs biased_R2

