# Batch config: rerun all missing experiments
# 1) prometheus2_7b on all 5 datasets (25 missing combos)
# 2) gpt52 on mediq_askdocs + clinical_formatting (1 missing combo)
#
# Usage:
#   python scripts/run_batch_from_yaml.py --batch-config configs/batch_rerun_missing.yaml
#
# NOTE: Run prometheus via vllm serve first; gpt52 via OpenAI API.
#       This config runs BOTH judges. If you want to run them separately,
#       use batch_rerun_prometheus.yaml or batch_rerun_gpt52_clinical.yaml instead.

batch:
  base_experiment_config: "configs/experiment.yaml"

  dataset_names:
    - "counselbench"
    - "medaesqa"
    - "medical_eval_sphere"
    - "mediq_askdocs"
    - "medval_bench"

  judge_models:
    - "vllmserve_prometheus2_7b"
    - "gpt52"

  bias_injector_models:
    - "gpt52"

  dataset_bias_plan: "configs/dataset_bias_plan.yaml"

  modes:
    - "word"

  inject_to: "non_gt"
  continue_on_error: true
  dry_run: false
  reuse_original_per_judge: true
  skip_existing_evals: true   # will skip already-completed combos
  log_dir: null
