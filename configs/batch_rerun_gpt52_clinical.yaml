# Batch config: rerun gpt52 judge on mediq_askdocs + clinical_formatting
# (previously failed due to OpenAI quota error)
#
# Usage:
#   python scripts/run_batch_from_yaml.py --batch-config configs/batch_rerun_gpt52_clinical.yaml

batch:
  base_experiment_config: "configs/experiment.yaml"

  dataset_names:
    - "mediq_askdocs"

  judge_models:
    - "gpt52"

  bias_injector_models:
    - "gpt52"

  dataset_bias_plan: "configs/dataset_bias_plan_rerun_clinical.yaml"

  modes:
    - "word"

  inject_to: "non_gt"
  continue_on_error: true
  dry_run: false
  reuse_original_per_judge: true
  skip_existing_evals: false   # force rerun even if old (broken) output exists
  log_dir: null
