# YAML-driven batch evaluation config
# 用法:
#   python scripts/run_batch_from_yaml.py --batch-config configs/batch_eval.yaml

batch:
  # 基础实验配置（会在每个组合上覆盖 data/judge/bias 部分字段）
  base_experiment_config: "configs/experiment.yaml"

  # 选择要跑的数据集（来自 configs/datasets.yaml 的 key）
  # 单个数据集用 dataset_name，多个用 dataset_names 列表
  dataset_names:
    - "counselbench"
    - "medaesqa"
    - "medical_eval_sphere"
    - "mediq_askdocs"
    - "medval_bench"

  # 指定评测模型（judge），可一次配置多个
  # 推荐使用 judge_models（列表）；judge_model 保留兼容旧写法
  #
  # Round-3（只跑 Medical）：
  #   biomistral_7b 和 deepseek_r1_distill_qwen_14b 已在 Round-2 跑完（各 35/35）。
  #   只剩 medical_qwen3_14b_1218 这最后一个模型。单独跑它的目的：
  #     1) 避免再启 vLLM 去白跑已完成模型（省 ~10 min）
  #     2) 防止 VLLM_USE_MODELSCOPE=True 误导 vLLM 去 ModelScope 重下 BioMistral/DeepSeek
  #   Medical 权重已由 modelscope CLI 预下载到本地路径，models.yaml 里直接指本地目录，
  #   不再依赖 VLLM_USE_MODELSCOPE 环境变量。
  judge_models:
    - "vllmserve_medical_qwen3_14b_1218"
  # judge_model: "qwen3_4b_instruct"

  # 指定 bias 注入模型（可多个）:
  # - "same_as_judge": 注入模型与当前 judge 模型保持一致
  # - 或填具体模型ID列表
  bias_injector_models:
    - "gpt52"
  # bias_injector_model: "qwen3_4b_instruct"  # 兼容旧写法

  # bias 选择策略:
  # - true: 自动使用每个数据集类别 prompt 文件中定义的全部 bias
  # - false: 仅使用下面手动指定的 eval_biases 列表
  use_all_biases: true
  # use_all_biases 为 false 时，手动指定 bias 列表：
  # eval_biases:
  #   - "jargon_overloading"
  #   - "plain_language"
  #   - "clinical_formatting"
  #   - "empathy_tone"
  #   - "authority_style"
  #   - "fake_citation"
  #   - "language_fluency"
  exclude_biases: []

  # 注入模式（可选 rewrite / word，可多个）
  modes:
    - "word"

  # 运行控制
  continue_on_error: true
  dry_run: false
  skip_existing_evals: true  # 跳过 results_summary.jsonl 中已有完整结果的组合
  # true: 每个 judge_model 只在第一个组合里计算一次 original judgment
  # 后续 bias 组合跳过 original，仅计算 bias 相关指标
  reuse_original_per_judge: true

  # vLLM serve 自动管理（vllmserve_* 模型自动启停）
  vllm_auto_serve: true       # true: 自动管理; false: 需要手动启停
  vllm_port: 8000
  vllm_max_model_len: 8192
  vllm_gpu_memory_utilization: 0.90
  vllm_startup_timeout: 1200  # 等待 vLLM 启动的超时时间（秒）。Medical-Qwen3-14B
  # 从本地加载 ~28GB 权重 + torch.compile 编译 ~5-10min，600s 边界偏紧，给到 20min 稳。

  # 可选：日志目录（不填则自动生成到 outputs/batch_logs）
  log_dir: null

