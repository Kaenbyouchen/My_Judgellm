  enabled: true
  inject_to: non_gt
  injection_mode: rewrite
  injector_model_config_keys:
  - model_id
  - allow_fallback_mock
  - use_cache
  - semantic_guard
  injector_type: openai
  model: gpt52
  model_id: gpt52
  semantic_guard:
    enabled: true
    max_attempts: 2
    on_fail: use_original
